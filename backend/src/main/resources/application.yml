spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: yuanqi-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/yuanqi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:yuanqi}
    password: ${MYSQL_PASSWORD:yuanqi-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  task:
    execution:
      thread-name-prefix: application-

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:yuanqi}
    audience: ${JWT_AUDIENCE:yuanqi-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

application:
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:16}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:200}
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: ${AGENT_CONNECT_TIMEOUT:5s}
    request-timeout: ${AGENT_REQUEST_TIMEOUT:10m}
  idempotency:
    processing-ttl: ${IDEMPOTENCY_PROCESSING_TTL:2m}
    response-ttl: ${IDEMPOTENCY_RESPONSE_TTL:24h}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

flowable:
  database-schema-update: ${FLOWABLE_DATABASE_SCHEMA_UPDATE:false}
  async-executor-activate: ${FLOWABLE_ASYNC_EXECUTOR_ACTIVATE:false}
