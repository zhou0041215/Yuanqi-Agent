spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/yuanqi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  data:
    redis:
      port: 16379

security:
  jwt:
    secret: yuanqi-local-development-secret-change-before-production
    issuer: yuanqi-dev
    audience: yuanqi-api

logging:
  level:
    com.yuanqi.backend: DEBUG

flowable:
  database-schema-update: true
  async-executor-activate: false
