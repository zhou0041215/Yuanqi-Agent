spring:
  datasource:
    url: jdbc:h2:mem:yuanqi;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

security:
  jwt:
    secret: yuanqi-unit-test-secret-with-at-least-32-characters
    issuer: yuanqi-test
    audience: yuanqi-api
  cors:
    allowed-origins: http://localhost:5173

flowable:
  database-schema-update: true
  async-executor-activate: false

application:
  flowable:
    database-type: mysql
